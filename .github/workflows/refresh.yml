name: Refresh CEC register

on:
  workflow_dispatch:          # run by hand: Actions -> Refresh CEC register -> Run workflow
  # To refresh automatically instead, uncomment:
  # schedule:
  #   - cron: "17 19 * * 0,3"   # Mon + Thu 05:17 AEST (Sun/Wed 19:17 UTC)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional XLSX support
        run: pip install --quiet openpyxl

      - name: Run the test suite against the committed data
        run: python -m unittest discover -s tests -t . -v

      - name: Download and merge the CEC lists (rows are never deleted, only marked delisted)
        run: python scripts/refresh.py

      - name: Rebuild the skill file with the new data
        run: python scripts/build_skill.py

      - name: Show what changed
        run: |
          python cec.py stats
          git --no-pager diff --stat -- data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then
            echo "No changes in register data."
            exit 0
          fi
          git commit -m "data: refresh CEC register $(date -u +%Y-%m-%d)"
          git push
