name: Refresh CEC register

on:
  schedule:
    - cron: "17 19 * * 0,3"   # Mon + Thu 05:17 AEST (Sun/Wed 19:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional XLSX support
        run: pip install --quiet openpyxl

      - name: Download and normalise the CEC lists
        run: python scripts/refresh.py

      - name: Smoke test the lookup CLI
        run: |
          python cec.py stats
          python -m unittest discover -s tests -v

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in register data."
            exit 0
          fi
          git commit -m "data: refresh CEC register $(date -u +%Y-%m-%d)"
          git push
